<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Phase 3b: X3DOMRenderAdapter.pickViewCenter() occlusion (throwaway test harness)</title>
<link rel="stylesheet" href="/vendor/scene-core/vendor/x3dom/x3dom.css">
<script src="/vendor/scene-core/vendor/x3dom/x3dom-full.js"></script>
</head>
<body>
<div id="status">loading...</div>
<x3d id="main" width="640px" height="480px">
  <scene>
    <viewpoint position="0 1.6 20" orientation="0 1 0 0"></viewpoint>
    <!-- Occluder: a wall 10m in front of the viewpoint, dead ahead. -->
    <transform id="occluder" translation="0 1.6 10">
      <shape ispickable="true">
        <appearance><material diffuseColor="0.8 0.2 0.2"></material></appearance>
        <box size="4 3 0.2"></box>
      </shape>
    </transform>
    <!-- Far marker: directly behind the occluder from the viewpoint's perspective, 20m away. -->
    <transform id="farMarker" translation="0 1.6 0">
      <shape ispickable="true">
        <appearance><material diffuseColor="0.2 0.8 0.3"></material></appearance>
        <box size="4 3 0.2"></box>
      </shape>
    </transform>
  </scene>
</x3d>
<pre id="log"></pre>
<script type="module">
import { X3DOMRenderAdapter } from "/vendor/scene-core/render-adapter/x3dom-render-adapter.mjs";

const log = document.getElementById('log');
function append(l) { log.textContent += l + "\n"; console.log(l); }
function nodeLabel(node) { return node ? (node.closest?.('#occluder') ? 'occluder' : node.closest?.('#farMarker') ? 'farMarker' : node.tagName) : null; }

async function run() {
  const el = document.getElementById('main');
  const adapter = new X3DOMRenderAdapter(window.x3dom);
  adapter.attach(el);
  await adapter.ready();
  append('adapter ready, backend: ' + adapter.runtime.backendName());

  // 1) Baseline: occluder is in front, should be hit first (nearer than the far marker).
  const beforeHide = adapter.pickViewCenter();
  append('before hide: ' + JSON.stringify({ node: nodeLabel(beforeHide?.node), distance: beforeHide?.distance, position: beforeHide?.position }));
  const occluderDetected = nodeLabel(beforeHide?.node) === 'occluder';
  const occluderDistancePlausible = beforeHide && Math.abs(beforeHide.distance - 9.9) < 0.5; // viewpoint at z=20, occluder front face at z=10.1

  // 2) Hide the occluder (X3DOM's own render-inclusion toggle — confirmed empirically, not
  //    three.js's `.visible`) and re-pick: the far marker should now be the nearest hit.
  const occluderShape = document.querySelector('#occluder shape');
  occluderShape.setAttribute('render', 'false');
  await new Promise((r) => setTimeout(r, 100));
  const afterHide = adapter.pickViewCenter();
  append('after hide: ' + JSON.stringify({ node: nodeLabel(afterHide?.node), distance: afterHide?.distance, position: afterHide?.position }));
  const farMarkerNowHit = nodeLabel(afterHide?.node) === 'farMarker';
  const farMarkerDistancePlausible = afterHide && Math.abs(afterHide.distance - 19.9) < 0.5;

  // 3) Restore the occluder and confirm it's detected again (round-trip correctness).
  occluderShape.setAttribute('render', 'true');
  await new Promise((r) => setTimeout(r, 100));
  const afterRestore = adapter.pickViewCenter();
  append('after restore: ' + JSON.stringify({ node: nodeLabel(afterRestore?.node), distance: afterRestore?.distance }));
  const occluderRedetected = nodeLabel(afterRestore?.node) === 'occluder';

  const ok = occluderDetected && occluderDistancePlausible && farMarkerNowHit && farMarkerDistancePlausible && occluderRedetected;

  window.__testResult = {
    ok, occluderDetected, occluderDistancePlausible, farMarkerNowHit, farMarkerDistancePlausible, occluderRedetected,
    backend: adapter.runtime.backendName(),
  };
  document.getElementById('status').textContent = ok ? 'PASS' : 'FAIL';
}
run().catch((err) => {
  append('ERROR: ' + (err && err.stack || err));
  window.__testResult = { ok: false, error: String(err && err.stack || err) };
  document.getElementById('status').textContent = 'error';
});
</script>
</body>
</html>
