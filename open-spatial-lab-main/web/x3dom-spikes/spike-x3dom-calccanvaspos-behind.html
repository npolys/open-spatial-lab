<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Probe: calcCanvasPos behavior for a point behind the camera</title>
<link rel="stylesheet" href="/vendor/scene-core/vendor/x3dom/x3dom.css">
<script src="/vendor/scene-core/vendor/x3dom/x3dom-full.js"></script>
</head>
<body>
<div id="status">loading...</div>
<x3d id="main" width="640px" height="420px">
  <scene>
    <viewpoint position="0 0 5" orientation="0 1 0 0"></viewpoint>
    <shape><appearance><material diffuseColor="0.8 0.2 0.2"></material></appearance><box size="1 1 1"></box></shape>
  </scene>
</x3d>
<pre id="log"></pre>
<script type="module">
function waitReady(el, timeoutMs = 10000) {
  return new Promise((resolve, reject) => {
    const t0 = performance.now();
    (function poll() {
      if (el.runtime) return resolve(el.runtime);
      if (performance.now() - t0 > timeoutMs) return reject(new Error('timeout'));
      setTimeout(poll, 30);
    })();
  });
}
async function run() {
  const el = document.getElementById('main');
  const rt = await waitReady(el);
  await new Promise(r => setTimeout(r, 300));
  const log = document.getElementById('log');
  const points = {
    in_front_center: [0, 0, 0],       // camera at z=5 looking toward -z (default orientation), this is in front
    in_front_near: [0, 0, 4],
    behind_camera: [0, 0, 10],        // behind the camera (camera at z=5, this is at z=10, further from origin than camera on the +z side)
    far_in_front: [0, 0, -50],
  };
  const results = {};
  for (const [name, p] of Object.entries(points)) {
    try {
      const pos = rt.calcCanvasPos(p[0], p[1], p[2]);
      results[name] = { input: p, canvasPos: pos };
    } catch (err) {
      results[name] = { input: p, error: String(err) };
    }
  }
  log.textContent = JSON.stringify(results, null, 2);
  window.__testResult = results;
  document.getElementById('status').textContent = 'done';
}
run().catch(e => { document.getElementById('status').textContent = 'error: ' + e; window.__testResult = { error: String(e) }; });
</script>
</body>
</html>
