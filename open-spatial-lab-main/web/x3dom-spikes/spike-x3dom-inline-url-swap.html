<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Diagnose (clean retest): swapping url on an already-loaded static Inline node</title>
<link rel="stylesheet" href="/vendor/scene-core/vendor/x3dom/x3dom.css">
<script src="/vendor/scene-core/vendor/x3dom/x3dom-full.js"></script>
</head>
<body>
<div id="status">loading...</div>
<x3d id="main" width="640px" height="420px">
  <scene>
    <viewpoint position="0 1 3"></viewpoint>
    <transform>
      <inline id="inl" url="/assets/equip-crown.glb" nameSpaceName="slotA"></inline>
    </transform>
  </scene>
</x3d>
<pre id="log"></pre>
<script type="module">
function waitReady(el, timeoutMs = 10000) {
  return new Promise((resolve, reject) => {
    const t0 = performance.now();
    (function poll() {
      if (el.runtime) return resolve(el.runtime);
      if (performance.now() - t0 > timeoutMs) return reject(new Error('timeout'));
      setTimeout(poll, 30);
    })();
  });
}
function pollCondition(fn, timeoutMs, intervalMs = 100) {
  const t0 = performance.now();
  return new Promise((resolve) => {
    (function poll() {
      const v = fn();
      if (v) return resolve({ ok: true, ms: performance.now() - t0, value: v });
      if (performance.now() - t0 > timeoutMs) return resolve({ ok: false, ms: performance.now() - t0 });
      setTimeout(poll, intervalMs);
    })();
  });
}
function childDefNames(el) {
  return Array.from(el.children || []).map((c) => c.getAttribute && c.getAttribute('def')).filter(Boolean);
}
async function run() {
  const el = document.getElementById('main');
  const rt = await waitReady(el);
  const inl = document.getElementById('inl');

  // Generous wait for the initial static load — this exact pattern succeeded twice before
  // (spike-x3dom-inline-gltf-probe.html), so a long timeout here should make failure decisive
  // rather than a timing artifact.
  const initialLoad = await pollCondition(() => inl.children.length > 0, 10000, 100);
  const namesAfterInitial = childDefNames(inl);

  const swap = { attempted: false };
  if (initialLoad.ok) {
    swap.attempted = true;
    swap.namesBeforeSwap = namesAfterInitial;
    inl.setAttribute('url', '/assets/equip-hammer.glb');
    swap.pollResult = await pollCondition(() => {
      const names = childDefNames(inl);
      return names.length > 0 && names.join(',') !== namesAfterInitial.join(',');
    }, 8000, 100);
    swap.namesAfterSwap = childDefNames(inl);
  }

  const result = { initialLoad, namesAfterInitial, swap };
  document.getElementById('log').textContent = JSON.stringify(result, null, 2);
  window.__testResult = result;
  document.getElementById('status').textContent = 'done';
}
run().catch(e => { document.getElementById('status').textContent = 'error: ' + e; window.__testResult = { error: String(e && e.stack || e) }; });
</script>
</body>
</html>
