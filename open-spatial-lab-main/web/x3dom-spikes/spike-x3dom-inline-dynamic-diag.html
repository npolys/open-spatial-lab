<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Diagnose: dynamic Inline node insertion orderings</title>
<link rel="stylesheet" href="/vendor/scene-core/vendor/x3dom/x3dom.css">
<script src="/vendor/scene-core/vendor/x3dom/x3dom-full.js"></script>
</head>
<body>
<div id="status">loading...</div>
<div id="mount" style="width:640px;height:420px;"></div>
<pre id="log"></pre>
<script type="module">
function waitReady(el, timeoutMs = 10000) {
  return new Promise((resolve, reject) => {
    const t0 = performance.now();
    (function poll() {
      if (el.runtime) return resolve(el.runtime);
      if (performance.now() - t0 > timeoutMs) return reject(new Error('timeout'));
      setTimeout(poll, 30);
    })();
  });
}
function pollChildren(el, timeoutMs) {
  const t0 = performance.now();
  return new Promise((resolve) => {
    (function poll() {
      const n = el.children ? el.children.length : 0;
      if (n > 0) return resolve({ loaded: true, ms: performance.now() - t0, count: n });
      if (performance.now() - t0 > timeoutMs) return resolve({ loaded: false, ms: performance.now() - t0 });
      setTimeout(poll, 50);
    })();
  });
}

async function run() {
  const mountEl = document.getElementById('mount');
  const x3dEl = document.createElement('x3d');
  x3dEl.setAttribute('width', '640px');
  x3dEl.setAttribute('height', '420px');
  const sceneEl = document.createElement('scene');
  x3dEl.appendChild(sceneEl);
  mountEl.appendChild(x3dEl);
  const vp = document.createElement('viewpoint');
  vp.setAttribute('position', '0 1 3');
  sceneEl.appendChild(vp);

  const rt = await waitReady(x3dEl);
  await new Promise((r) => setTimeout(r, 300));
  const results = {};

  // Case A: create <inline url=...>, append to a transform, append transform to scene (all in one go) — matches createInlineAsset's current (failing) behavior.
  {
    const inline = document.createElement('inline');
    inline.setAttribute('url', '/assets/equip-crown.glb');
    const t = document.createElement('transform');
    t.setAttribute('translation', '-2 0 0');
    t.appendChild(inline);
    sceneEl.appendChild(t);
    results.caseA_urlSetBeforeAnyInsertion = await pollChildren(inline, 6000);
  }

  // Case D: explicitly set load="true" — the static-markup success case showed this attribute
  // present (X3DOM's own default-expansion added it during initial page-parse); maybe dynamic
  // creation doesn't get that default applied and needs it set explicitly.
  {
    const inline = document.createElement('inline');
    inline.setAttribute('url', '/assets/equip-crown.glb');
    inline.setAttribute('load', 'true');
    const t = document.createElement('transform');
    t.setAttribute('translation', '-4 0 0');
    t.appendChild(inline);
    sceneEl.appendChild(t);
    results.caseD_explicitLoadTrue = await pollChildren(inline, 6000);
  }

  // Case E: like D, but set load AFTER insertion (attribute-mutation trigger, same theory as
  // case B but for the load flag specifically instead of url).
  {
    const inline = document.createElement('inline');
    inline.setAttribute('url', '/assets/equip-crown.glb');
    inline.setAttribute('load', 'false');
    const t = document.createElement('transform');
    t.setAttribute('translation', '4 0 0');
    t.appendChild(inline);
    sceneEl.appendChild(t);
    await new Promise((r) => setTimeout(r, 200));
    inline.setAttribute('load', 'true');
    results.caseE_loadFlagToggledAfterInsertion = await pollChildren(inline, 6000);
  }

  // Case B: append EMPTY <inline> (no url yet) into the live scene first, THEN set url afterward.
  {
    const inline = document.createElement('inline');
    const t = document.createElement('transform');
    t.setAttribute('translation', '0 0 0');
    t.appendChild(inline);
    sceneEl.appendChild(t);
    await new Promise((r) => setTimeout(r, 200));
    inline.setAttribute('url', '/assets/equip-crown.glb');
    results.caseB_urlSetAfterLiveInsertion = await pollChildren(inline, 6000);
  }

  // Case C: like A, but re-set the SAME url again after insertion (attribute mutation on an
  // already-set, already-inserted element) to see if that re-triggers loading.
  {
    const inline = document.createElement('inline');
    inline.setAttribute('url', '/assets/equip-crown.glb');
    const t = document.createElement('transform');
    t.setAttribute('translation', '2 0 0');
    t.appendChild(inline);
    sceneEl.appendChild(t);
    await new Promise((r) => setTimeout(r, 200));
    const before = await pollChildren(inline, 500);
    inline.setAttribute('url', '/assets/equip-crown.glb');
    results.caseC_beforeRetrigger = before;
    results.caseC_afterRetrigger = await pollChildren(inline, 6000);
  }

  document.getElementById('log').textContent = JSON.stringify(results, null, 2);
  window.__testResult = results;
  document.getElementById('status').textContent = 'done';
}
run().catch(e => { document.getElementById('status').textContent = 'error: ' + e; window.__testResult = { error: String(e && e.stack || e) }; });
</script>
</body>
</html>
