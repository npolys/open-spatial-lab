<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Phase 6: X3DOMPortalRenderer capture-and-display loop (throwaway test harness)</title>
<link rel="stylesheet" href="/vendor/scene-core/vendor/x3dom/x3dom.css">
<script src="/vendor/scene-core/vendor/x3dom/x3dom-full.js"></script>
<style>
  body { font: 13px ui-monospace, Menlo, monospace; background: #0b1020; color: #d9e6ff; margin: 0; padding: 12px; }
  #mount { width: 480px; height: 360px; }
  #log { white-space: pre-wrap; margin-top: 12px; background: #11162a; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>
<div id="status">loading...</div>
<div id="mount"></div>
<pre id="log"></pre>
<script type="module">
import { X3DOMRenderAdapter } from "/vendor/scene-core/render-adapter/x3dom-render-adapter.mjs";
import { X3DOMPortalRenderer } from "/x3dom-portal-renderer.mjs";

const log = document.getElementById('log');
function append(line) { log.textContent += line + "\n"; console.log(line); }

async function run() {
  const mountEl = document.getElementById('mount');
  const mainAdapter = new X3DOMRenderAdapter(window.x3dom);
  mainAdapter.mount(mountEl, { width: 480, height: 360, camera: { fov: 50, near: 0.1, far: 100 } });
  mainAdapter.setCameraPose(mainAdapter.camera, { position: [0, 1.6, 3], lookAt: [0, 1, 0] });
  await mainAdapter.ready();
  append('main adapter ready, backend: ' + mainAdapter.runtime.backendName());

  const hostCountBefore = document.querySelectorAll('x3d').length;

  const portalRenderer = new X3DOMPortalRenderer(window.x3dom, { captureIntervalMs: 0 });
  const destinationAdapter = portalRenderer.createDestinationAdapter({ width: 128, height: 128 });
  await destinationAdapter.ready();
  append('destination adapter ready, backend: ' + destinationAdapter.runtime.backendName());

  const hostCountAfterCreate = document.querySelectorAll('x3d').length;

  // Spinning cone in the destination scene — a live capture loop should show its color/position
  // change between captures (same liveness-proof approach as spike-x3dom-portal.html).
  const destCamera = destinationAdapter.createPerspectiveCamera({ fov: 50, near: 0.1, far: 50 });
  destinationAdapter.sceneRoot.appendChild(destCamera);
  destinationAdapter.setCameraPose(destCamera, { position: [0, 1, 4], lookAt: [0, 0.5, 0] });

  const spinner = destinationAdapter.createMesh(
    destinationAdapter.createGeometry({ type: 'cone', radius: 0.5, height: 1 }),
    destinationAdapter.createMaterial({ type: 'standard', color: '#4d80e6' }),
  );
  destinationAdapter.add(destinationAdapter.sceneRoot, spinner);

  // Aperture quad in the MAIN scene — capture() output gets applied as this material's map.
  const apertureMaterial = mainAdapter.createMaterial({ type: 'basic', color: '#ffffff' });
  const aperture = mainAdapter.createMesh(
    mainAdapter.createGeometry({ type: 'box', width: 1.6, height: 1.6, depth: 0.02 }),
    apertureMaterial,
  );
  mainAdapter.setPosition(aperture, 0, 1, 0);
  mainAdapter.add(mainAdapter.sceneRoot, aperture);

  const shots = [];
  let lastResult = null;
  for (let i = 0; i < 4; i += 1) {
    spinner.setAttribute('rotation', `0 1 0 ${(i * 0.9).toFixed(3)}`);
    await new Promise((r) => setTimeout(r, 120));
    lastResult = await portalRenderer.capture(destinationAdapter, destCamera, 128, 128, mainAdapter);
    shots.push({
      hasTexture: !!lastResult.texture,
      textureKind: lastResult.texture && lastResult.texture.kind,
      url: lastResult.texture && lastResult.texture.el.getAttribute('url'),
    });
  }

  const apertureHasImageTexture = () => {
    const rebuilt = mainAdapter.createMaterial({ type: 'basic', color: '#ffffff', map: lastResult ? lastResult.texture : null });
    return !!rebuilt.appearanceEl.querySelector('imagetexture');
  };

  const allShotsHaveDataUrls = shots.every((s) => s.hasTexture && s.textureKind === 'x3d-canvas-texture' && typeof s.url === 'string' && s.url.startsWith('data:'));
  const urlsChangedOverTime = new Set(shots.map((s) => s.url)).size > 1;
  const sameTextureHandleReused = shots.length > 1 && shots.every((s) => s.textureKind === shots[0].textureKind);

  append('shots: ' + JSON.stringify(shots.map((s) => ({ hasTexture: s.hasTexture, textureKind: s.textureKind, urlLen: s.url ? s.url.length : 0 })), null, 2));
  append('allShotsHaveDataUrls: ' + allShotsHaveDataUrls);
  append('urlsChangedOverTime (liveness): ' + urlsChangedOverTime);
  append('sameTextureHandleReused: ' + sameTextureHandleReused);
  append('apertureHasImageTexture: ' + apertureHasImageTexture());
  append('hostCountBefore=' + hostCountBefore + ' afterCreate=' + hostCountAfterCreate);

  portalRenderer.dispose(destinationAdapter);
  await new Promise((r) => setTimeout(r, 50));
  const hostCountAfterDispose = document.querySelectorAll('x3d').length;
  append('hostCountAfterDispose=' + hostCountAfterDispose);

  const ok = allShotsHaveDataUrls && urlsChangedOverTime && sameTextureHandleReused &&
    apertureHasImageTexture() && hostCountAfterCreate === hostCountBefore + 1 &&
    hostCountAfterDispose === hostCountBefore;

  window.__testResult = {
    ok, allShotsHaveDataUrls, urlsChangedOverTime, sameTextureHandleReused,
    hostCountBefore, hostCountAfterCreate, hostCountAfterDispose,
    backend: mainAdapter.runtime.backendName(),
  };
  document.getElementById('status').textContent = ok ? 'PASS' : 'FAIL';
}
run().catch((err) => {
  append('ERROR: ' + (err && err.stack || err));
  window.__testResult = { ok: false, error: String(err && err.stack || err) };
  document.getElementById('status').textContent = 'error';
});
</script>
</body>
</html>
