<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>X3DOM portal-fallback spike B: CSS-composited overlay (Phase 0, throwaway)</title>
<link rel="stylesheet" href="/vendor/scene-core/vendor/x3dom/x3dom.css">
<script src="/vendor/scene-core/vendor/x3dom/x3dom-full.js"></script>
<script type="importmap">
{ "imports": { "three": "/vendor/scene-core/vendor/three/three.module.js" } }
</script>
<style>
  body { font: 13px ui-monospace, Menlo, monospace; background: #0b1020; color: #d9e6ff; margin: 0; padding: 12px; }
  #stage { position: relative; width: 720px; height: 480px; }
  #main { position: absolute; left: 0; top: 0; width: 720px; height: 480px; }
  #overlay { position: absolute; left: 0; top: 0; width: 720px; height: 480px; pointer-events: none; }
  #log { white-space: pre-wrap; margin-top: 12px; background: #11162a; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>
<div id="status">loading...</div>
<div id="stage">
  <x3d id="main" width="720px" height="480px">
    <scene>
      <viewpoint position="0 1.6 5"></viewpoint>
      <shape>
        <appearance><material diffuseColor="0.5 0.5 0.5"></material></appearance>
        <plane size="8 8"></plane>
      </shape>
      <transform translation="0 1.4 -1">
        <shape>
          <appearance><material diffuseColor="0.15 0.2 0.35" transparency="0.3"></material></appearance>
          <circle2D radius="0.001"></circle2D>
        </shape>
      </transform>
    </scene>
  </x3d>
  <canvas id="overlay"></canvas>
</div>
<div id="log">(results appear here)</div>
<script type="module">
import * as THREE from "three";
const log = document.getElementById('log');
const status = document.getElementById('status');
function append(line) { log.textContent += line + "\n"; console.log(line); }

function waitReady(x3dEl, timeoutMs = 10000) {
  return new Promise((resolve, reject) => {
    const t0 = performance.now();
    (function poll() {
      if (x3dEl.runtime) return resolve(x3dEl.runtime);
      if (performance.now() - t0 > timeoutMs) return reject(new Error('x3dom runtime did not attach within ' + timeoutMs + 'ms'));
      setTimeout(poll, 30);
    })();
  });
}

async function run() {
  const mainEl = document.getElementById('main');
  const mainRuntime = await waitReady(mainEl);
  status.textContent = 'x3dom ready — backend: ' + mainRuntime.backendName();
  append('backend: ' + mainRuntime.backendName());
  await new Promise(r => setTimeout(r, 300));

  // Portal aperture: world position + a horizontal edge point, to derive projected screen
  // center + radius via the runtime's own world->canvas projection (calcCanvasPos).
  const apertureWorld = [0, 1.4, -1];
  const apertureEdgeWorld = [0.9, 1.4, -1];
  const centerPx = mainRuntime.calcCanvasPos(...apertureWorld);
  const edgePx = mainRuntime.calcCanvasPos(...apertureEdgeWorld);
  const radiusPx = Math.hypot(edgePx[0] - centerPx[0], edgePx[1] - centerPx[1]);
  append('aperture projected: center=' + centerPx.map(n => n.toFixed(1)) + ' radiusPx=' + radiusPx.toFixed(1));

  const overlay = document.getElementById('overlay');
  overlay.style.clipPath = `circle(${radiusPx}px at ${centerPx[0]}px ${centerPx[1]}px)`;

  const renderer = new THREE.WebGLRenderer({ canvas: overlay, antialias: true, alpha: true });
  renderer.setSize(720, 480, false);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a2b4a);
  const camera = new THREE.PerspectiveCamera(60, 720 / 480, 0.05, 60);
  camera.position.set(0, 1.6, 1.2);
  camera.lookAt(0, 1.4, -1);
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const key = new THREE.DirectionalLight(0xffffff, 0.8);
  key.position.set(2, 3, 2);
  scene.add(key);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 24), new THREE.MeshStandardMaterial({ color: 0x3a8fdd }));
  cone.position.set(0, 1.4, -1);
  scene.add(cone);

  const durationMs = 4000;
  let frames = 0;
  const t0 = performance.now();
  let overlayDone = false;
  let x3domFramesDuringOverlay = 0;
  const unregisterX3domCounter = (() => {
    let count = 0;
    const prevEnterFrame = mainRuntime.enterFrame;
    mainRuntime.enterFrame = function () { count += 1; if (typeof prevEnterFrame === 'function') prevEnterFrame(); };
    return () => count;
  })();

  await new Promise((resolve) => {
    function tick() {
      cone.rotation.y += 0.04;
      renderer.render(scene, camera);
      frames += 1;
      if (performance.now() - t0 < durationMs) {
        requestAnimationFrame(tick);
      } else {
        resolve();
      }
    }
    requestAnimationFrame(tick);
  });
  x3domFramesDuringOverlay = unregisterX3domCounter();

  const elapsedS = (performance.now() - t0) / 1000;
  const overlayFps = frames / elapsedS;
  const x3domFps = x3domFramesDuringOverlay / elapsedS;
  append('=== Spike B: CSS-composited live overlay ===');
  append('overlay (three.js) frames: ' + frames + ' over ' + elapsedS.toFixed(2) + 's => ' + overlayFps.toFixed(1) + ' fps');
  append('concurrent x3dom (main env) fps while overlay ran: ' + x3domFps.toFixed(1));

  window.__spikeResult = {
    backend: mainRuntime.backendName(),
    apertureCenterPx: centerPx, apertureRadiusPx: radiusPx,
    overlayFrames: frames, elapsedS, overlayFps, x3domFps,
  };
  status.textContent = 'done — overlay ' + overlayFps.toFixed(1) + ' fps, x3dom concurrent ' + x3domFps.toFixed(1) + ' fps';
}
run().catch((err) => { append('ERROR: ' + (err && err.stack || err)); status.textContent = 'error'; });
</script>
</body>
</html>
