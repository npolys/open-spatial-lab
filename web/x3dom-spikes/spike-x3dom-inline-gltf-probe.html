<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Probe: X3DOM Inline node loading a real .glb file</title>
<link rel="stylesheet" href="/vendor/scene-core/vendor/x3dom/x3dom.css">
<script src="/vendor/scene-core/vendor/x3dom/x3dom-full.js"></script>
</head>
<body>
<div id="status">loading...</div>
<x3d id="main" width="640px" height="420px">
  <scene>
    <viewpoint position="0 1.6 3"></viewpoint>
    <transform id="wrap">
      <inline id="inl" url="/assets/equip-crown.glb" nameSpaceName="crown"></inline>
    </transform>
  </scene>
</x3d>
<pre id="log"></pre>
<script type="module">
function waitReady(el, timeoutMs = 10000) {
  return new Promise((resolve, reject) => {
    const t0 = performance.now();
    (function poll() {
      if (el.runtime) return resolve(el.runtime);
      if (performance.now() - t0 > timeoutMs) return reject(new Error('timeout'));
      setTimeout(poll, 30);
    })();
  });
}
async function run() {
  const el = document.getElementById('main');
  const rt = await waitReady(el);
  const inl = document.getElementById('inl');
  const events = [];
  inl.addEventListener('load', (e) => events.push({ type: 'load', detail: e.detail || null, t: performance.now() }));
  inl.addEventListener('error', (e) => events.push({ type: 'error', detail: e.detail || null, t: performance.now() }));

  // Race the events against a timeout, and separately poll DOM child count as a fallback signal.
  const t0 = performance.now();
  await new Promise((resolve) => {
    const check = () => {
      const childCount = inl.children ? inl.children.length : (inl.childNodes ? inl.childNodes.length : 0);
      if (events.length > 0 || childCount > 0 || performance.now() - t0 > 8000) return resolve();
      setTimeout(check, 100);
    };
    check();
  });
  const elapsed = performance.now() - t0;
  const childCount = inl.children ? inl.children.length : 0;
  const bbox = (() => {
    try { return rt.getCenter(inl); } catch (e) { return 'error: ' + e; }
  })();

  const result = {
    events,
    elapsedMs: elapsed,
    inlineChildCount: childCount,
    inlineOuterHTMLSnippet: inl.outerHTML.slice(0, 500),
    centerViaGetCenter: bbox,
  };
  document.getElementById('log').textContent = JSON.stringify(result, null, 2);
  window.__testResult = result;
  document.getElementById('status').textContent = 'done';
}
run().catch(e => { document.getElementById('status').textContent = 'error: ' + e; window.__testResult = { error: String(e && e.stack || e) }; });
</script>
</body>
</html>
