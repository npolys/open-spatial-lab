<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>X3DOM portal-fallback spike (Phase 0, throwaway)</title>
<link rel="stylesheet" href="/vendor/scene-core/vendor/x3dom/x3dom.css">
<script src="/vendor/scene-core/vendor/x3dom/x3dom-full.js"></script>
<style>
  body { font: 13px ui-monospace, Menlo, monospace; background: #0b1020; color: #d9e6ff; margin: 0; padding: 12px; }
  #source, #main { width: 480px; height: 360px; display: inline-block; vertical-align: top; }
  #log { white-space: pre-wrap; margin-top: 12px; background: #11162a; padding: 10px; border-radius: 6px; }
  .aperture-plane { position: relative; }
</style>
</head>
<body>
<div id="status">loading x3dom...</div>
<div>
  <x3d id="source" width="480px" height="360px">
    <scene>
      <viewpoint position="0 1.6 4" orientation="0 1 0 0"></viewpoint>
      <shape>
        <appearance><material diffuseColor="0.8 0.2 0.2"></material></appearance>
        <box size="1 1 1"></box>
      </shape>
      <transform rotation="0 1 0 0.6" translation="0 0.5 -2">
        <shape>
          <appearance><material diffuseColor="0.2 0.8 0.3"></material></appearance>
          <sphere radius="0.6"></sphere>
        </shape>
      </transform>
      <transform DEF="spinner" id="spinner" rotation="0 1 0 0" translation="1.5 0.5 0">
        <shape>
          <appearance><material diffuseColor="0.3 0.5 0.9"></material></appearance>
          <cone bottomRadius="0.5" height="1"></cone>
        </shape>
      </transform>
    </scene>
  </x3d>
  <x3d id="main" width="480px" height="360px">
    <scene>
      <viewpoint position="0 1.6 4"></viewpoint>
      <shape>
        <appearance><material diffuseColor="0.5 0.5 0.5"></material></appearance>
        <plane size="6 6"></plane>
      </shape>
    </scene>
  </x3d>
</div>
<div id="log">(results appear here)</div>
<script>
const log = document.getElementById('log');
const status = document.getElementById('status');
function append(line) { log.textContent += line + "\n"; console.log(line); }

// Tried the documented runtime.ready callback first (see git history of this file): it's a
// fire-once callback, and in this headless/fast-init environment X3DOM's ready moment passes
// *before* window 'load' fires, so assigning .ready afterward misses it — same class of race
// as a missed DOM event, just at a different point in the lifecycle. Polling for x3dEl.runtime
// truthiness sidesteps that: it doesn't depend on catching a one-shot callback at the right instant.
function waitReady(x3dEl, timeoutMs = 10000) {
  return new Promise((resolve, reject) => {
    const t0 = performance.now();
    (function poll() {
      if (x3dEl.runtime) return resolve(x3dEl.runtime);
      if (performance.now() - t0 > timeoutMs) return reject(new Error('x3dom runtime did not attach within ' + timeoutMs + 'ms'));
      setTimeout(poll, 30);
    })();
  });
}

async function run() {
  const sourceEl = document.getElementById('source');
  const mainEl = document.getElementById('main');
  const sourceRuntime = await waitReady(sourceEl);
  const mainRuntime = await waitReady(mainEl);
  status.textContent = 'x3dom ready — backend: ' + sourceRuntime.backendName();
  append('backend: ' + sourceRuntime.backendName());

  // spin the cone so successive screenshots are visibly different (proves liveness, not a cached frame)
  const spinner = document.getElementById('spinner');
  let spinAngle = 0;
  sourceRuntime.enterFrame = function () {
    spinAngle += 0.05;
    spinner.setAttribute('rotation', '0 1 0 ' + spinAngle.toFixed(3));
  };

  // --- Spike A: getScreenshot() throughput ---
  // Also count the *other* live x3d instance's own frames concurrently, matching Spike B's
  // methodology: a real portal always has a second live instance rendering (main env), and
  // Spike B showed that can contend hard for the software rasterizer — check A has the same cost.
  let mainConcurrentFrames = 0;
  const prevMainEnterFrame = mainRuntime.enterFrame;
  mainRuntime.enterFrame = function () { mainConcurrentFrames += 1; if (typeof prevMainEnterFrame === 'function') prevMainEnterFrame(); };

  await new Promise(r => setTimeout(r, 500)); // let a few frames render first
  const durationMs = 4000;
  const t0 = performance.now();
  let shots = 0;
  let totalCaptureMs = 0;
  let totalDecodeMs = 0;
  let distinctFrames = 1;
  let previousUri = null;
  const lastImg = new Image();
  while (performance.now() - t0 < durationMs) {
    const c0 = performance.now();
    const dataUri = sourceRuntime.getScreenshot();
    const c1 = performance.now();
    totalCaptureMs += (c1 - c0);
    if (previousUri !== null && dataUri !== previousUri) distinctFrames += 1;
    previousUri = dataUri;
    await new Promise((resolve) => {
      const d0 = performance.now();
      lastImg.onload = () => { totalDecodeMs += (performance.now() - d0); resolve(); };
      lastImg.onerror = () => { resolve(); };
      lastImg.src = dataUri;
    });
    shots += 1;
  }
  const elapsedS = (performance.now() - t0) / 1000;
  const fps = shots / elapsedS;
  const mainConcurrentFps = mainConcurrentFrames / elapsedS;
  append('=== Spike A: getScreenshot() polling ===');
  append('shots: ' + shots + ' over ' + elapsedS.toFixed(2) + 's => ' + fps.toFixed(1) + ' fps achievable');
  append('distinct frames (liveness check, spinner rotating): ' + distinctFrames + ' / ' + shots);
  append('avg capture (getScreenshot call) ms: ' + (totalCaptureMs / shots).toFixed(2));
  append('avg decode (Image onload) ms: ' + (totalDecodeMs / shots).toFixed(2));
  append('avg total per-shot ms: ' + ((totalCaptureMs + totalDecodeMs) / shots).toFixed(2));
  append('concurrent main x3d fps while polling source: ' + mainConcurrentFps.toFixed(1));

  window.__spikeResult = {
    backend: sourceRuntime.backendName(),
    shots, elapsedS, fps, distinctFrames,
    avgCaptureMs: totalCaptureMs / shots,
    avgDecodeMs: totalDecodeMs / shots,
    mainConcurrentFps,
  };
  status.textContent = 'done — ' + fps.toFixed(1) + ' fps';
}
run().catch((err) => { append('ERROR: ' + (err && err.stack || err)); status.textContent = 'error'; });
</script>
</body>
</html>
